- name: Dr. Nathan Click
  role: Founding Chairman
  photo: 3f36b8_7f4df61a083e44429a6e51fb10c27532.jpg
  bio:
    - "Dr. Nathan Click serves as Founding Chairman of the People’s Empowerment PAC, providing strategic leadership for the organization’s mission to expand civic participation and develop community-centered political leadership. An entrepreneur and civic innovator, Click has worked at the intersection of grassroots organizing, economic development, and political engagement."
    - "He has supported initiatives focused on voter participation, leadership development, and building sustainable civic infrastructure in historically underserved communities. Through his leadership, the PAC works to strengthen pathways for emerging leaders and support candidates committed to equitable representation."
- name: The Honorable Erica Smith
  role: Secretary | Former North Carolina State Senator
  photo: 3f36b8_9a5ad669c20f4bc7b790a4ec4bd3affe.jpg
  bio:
    - "Erica D. Smith serves as Secretary of the People’s Empowerment PAC and provides governance leadership supporting the organization’s strategic efforts to expand civic engagement and political representation."
    - "Smith previously represented northeastern North Carolina in the State Senate, where she championed public education investment, rural economic development, healthcare access, and policies supporting historically underserved communities."
- name: Stacey Motley
  role: Treasurer | Organizational Culture & Leadership Consultant
  photo: 3f36b8_19f3436fbecd4beeb275ebb599b4d9fb.jpg
  bio:
    - "Stacey Motley serves as Treasurer of the People’s Empowerment PAC, overseeing financial stewardship and ensuring the organization maintains strong governance and transparency in support of its mission."
    - "Motley is a consultant and entrepreneur specializing in trauma-informed leadership, inclusive workplace culture, and community empowerment. She works with organizations and leaders to build equitable systems that foster resilience and long-term impact."
- name: The Honorable Michael R. Morgan
  role: Board Member | Former NC Supreme Court Justice
  photo: 3f36b8_a94b66c7ce544570b052793cbf068100.jpg
  bio:
    - "Justice Michael R. Morgan is a former Associate Justice of the North Carolina Supreme Court and one of the state’s most respected legal leaders. Over a judicial career spanning more than three decades, he served as a District Court judge, Superior Court judge, and ultimately on the state’s highest court."
    - "Justice Morgan is widely recognized for his commitment to fairness, judicial independence, and expanding access to justice."
- name: The Honorable Raymond Smith Jr.
  role: Board Member | Former NC State Representative
  photo: 3f36b8_43bee02ee898467f88f9d97a5eec86d4.jpg
  bio:
    - "Raymond E. Smith Jr. is an attorney and former member of the North Carolina House of Representatives who has dedicated his career to public service and community advocacy."
    - "During his time in the legislature, Smith focused on policies supporting working families, expanding economic opportunity, and strengthening local communities."
- name: The Honorable Carolyn Thompson
  role: Board Member | County Attorney, Guilford County
  photo: 3f36b8_5979dc4d85e54ea0b35a9da461a87dc3.jpg
  bio:
    - "Judge Carolyn J. Thompson currently serves as County Attorney for Guilford County, where she acts as chief legal advisor to county leadership on governance, policy, and administrative matters."
    - "She previously served more than two decades in North Carolina’s judiciary as both a District Court and Superior Court judge and was appointed to the North Carolina Court of Appeals in 2023."
- name: Dr. Kimberly Hardy
  role: Board Member | Educator & Social Policy Advocate
  photo: 3f36b8_6960c0bc28b24a56aabd876c37a75c15.jpg
  bio:
    - "Dr. Kimberly Hardy is a social worker, educator, and advocate dedicated to advancing equity, education, and community wellness. Her work focuses on addressing systemic barriers and strengthening opportunities for historically marginalized communities."
    - "Through her work in social policy, education, and community engagement, she has contributed to programs supporting youth development, family stability, and community empowerment."
