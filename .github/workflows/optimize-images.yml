name: Optimize images
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-images.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Convert large PNG photos to JPG and shrink big JPGs
        run: |
          python3 - <<'PY'
          import os, glob, re
          from PIL import Image
          renamed = {}
          for p in glob.glob('assets/img/**/*.*', recursive=True):
              size = os.path.getsize(p)
              if size < 400_000: continue
              im = Image.open(p)
              if im.mode in ('RGBA', 'LA', 'P'):
                  im = im.convert('RGBA'); bg = Image.new('RGB', im.size, (255,255,255)); bg.paste(im, mask=im.split()[-1]); im = bg
              else:
                  im = im.convert('RGB')
              im.thumbnail((1800, 1800))
              out = re.sub(r'\.(png|jpe?g|webp)$', '.jpg', p, flags=re.I)
              im.save(out, 'JPEG', quality=80, optimize=True, progressive=True)
              if out != p:
                  os.remove(p); renamed[os.path.basename(p)] = os.path.basename(out)
              print(p, size//1024, 'KB ->', os.path.getsize(out)//1024, 'KB')
          for f in glob.glob('**/*', recursive=True):
              if not os.path.isfile(f) or f.startswith(('.git/', 'assets/img/')) or not f.endswith(('.html', '.md', '.yml', '.css', '.js')): continue
              s = open(f, encoding='utf-8').read(); t = s
              for a, b in renamed.items(): t = t.replace(a, b)
              if t != s: open(f, 'w', encoding='utf-8').write(t); print('updated refs in', f)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize large images" || echo "nothing to commit"
          git pull --rebase
          git push
