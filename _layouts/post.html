---
layout: default
---
<article class="post">
  <header class="post-head wrap narrow">
    <p class="eyebrow"><a href="{{ '/blog' | relative_url }}">Empowered Insights</a></p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.author }} · {{ page.date | date: "%B %-d, %Y" }}</p>
  </header>
  {% if page.image %}<figure class="post-cover wrap narrow"><img src="{{ page.image | relative_url }}" alt=""></figure>{% endif %}
  <div class="prose wrap narrow">{{ content }}</div>
  <div class="wrap narrow post-foot"><a class="btn btn-ghost-dark" href="{{ '/blog' | relative_url }}">&larr; All posts</a></div>
</article>
